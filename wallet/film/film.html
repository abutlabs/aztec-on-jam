<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aztec on JAM: the films' title scenes</title>
<!-- The films' title scenes, drawn by film.mjs one frame at a time: ?scene=crawl (the intro's
     opening crawl, its words from crawl.md) and end (the demo's closing card). Each scene exposes
     window.film = { length: seconds, still: true for one frame, at(t): draw time t }; the crawl's
     also crawl(words), which sets its words and length. -->
<style>
  :root { --yellow: #ffe81f; --blue: #4bd5ee; --space: #05040b; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: #fff;
    font-family: "Franklin Gothic Medium", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  canvas { position: fixed; inset: 0; }
  .scene { position: fixed; inset: 0; display: none; }
  body[data-scene="crawl"] #crawl, body[data-scene="end"] #end { display: block; }

  /* the crawl */
  #prelude { position: absolute; left: 0; right: 0; top: 40%; text-align: center; color: var(--blue);
    font: 400 30px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; opacity: 0; }
  #title { position: absolute; left: 50%; top: 50%; text-align: center; color: transparent;
    -webkit-text-stroke: 3px var(--yellow); font: 900 110px/0.95 "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: 0.06em; opacity: 0; transform: translate(-50%, -50%) scale(2.6); white-space: nowrap; }
  #title small { display: block; font-size: 0.42em; letter-spacing: 0.3em; margin-top: 0.15em; }
  /* the text plane tilts back from the bottom edge of the screen, so all of it recedes */
  #far { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(to bottom, transparent 6%, #000 36%); }
  #stage { position: absolute; left: 50%; bottom: 0; width: 640px; height: 1900px; margin-left: -320px;
    overflow: hidden; transform-origin: 50% 100%; transform: perspective(320px) rotateX(24deg); }
  #text { position: absolute; left: 0; right: 0; top: 100%; color: var(--yellow);
    font: 700 36px/1.32 "Helvetica Neue", Helvetica, Arial, sans-serif; text-align: justify; }
  #text .ep { text-align: center; font-size: 30px; margin: 0; }
  #text h1 { text-align: center; font-size: 62px; margin: 0.1em 0 0.7em; letter-spacing: 0.04em; }
  #text p { margin: 0 0 1.1em; }

  /* the cards */
  .card { position: absolute; inset: 34px 44px; background: rgba(12, 9, 28, 0.9); border: 2px solid var(--yellow);
    border-radius: 14px; padding: 26px 34px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
  .card h2 { margin: 0; color: var(--yellow); font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase; }
  #end .card { display: grid; place-content: center; text-align: center; }
  #end h2 { font-size: 46px; letter-spacing: 0.06em; }
  #end p { font-size: 20px; color: #e9e4ff; margin: 18px 0 0; }
  #end code { color: var(--yellow); font-size: 19px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<section class="scene" id="crawl">
  <!-- the words are crawl.md's, set by film.mjs (window.film.crawl) -->
  <div id="prelude"></div>
  <div id="title"><span></span><small></small></div>
  <div id="far"><div id="stage"><div id="text"></div></div></div>
</section>

<section class="scene" id="end"><div class="card">
  <h2>May the proofs be with you</h2>
  <p>Run the whole thing on your machine:</p>
  <p><code>git clone https://github.com/abutlabs/aztec-on-jam</code></p>
  <p><code>DEVNET_NET=jb-lasair6 tools/aztec-local/on-jam.sh</code></p>
</div></section>

<script>
  const params = new URLSearchParams(location.search);
  const scene = params.get("scene") || "crawl";
  document.body.dataset.scene = scene;

  // a fixed starfield: the same stars in every frame and every run
  const cv = document.getElementById("stars"), cx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++) {
    cx.fillStyle = `rgba(255,255,255,${0.25 + rnd() * 0.75})`;
    cx.beginPath(); cx.arc(rnd() * cv.width, rnd() * cv.height, rnd() < 0.9 ? 0.7 : 1.3, 0, 7); cx.fill();
  }

  const $ = (id) => document.getElementById(id);
  const ramp = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));   // 0 before a, 1 after b
  const CRAWL_FROM = 7.5, SPEED = 62;     // the crawl starts at 7.5 s and climbs 62 px a second
  const travel = () => $("text").offsetHeight + $("stage").offsetHeight * 0.4;  // until the last line is far off
  window.film = scene === "crawl" ? {
    length: CRAWL_FROM,
    /** crawl.md's words: { prelude, title, subtitle, episode, heading, paragraphs: [...] } */
    crawl(w) {
      $("prelude").textContent = w.prelude;
      $("title").firstChild.textContent = w.title;
      $("title").lastChild.textContent = w.subtitle;
      const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls, textContent: text });
      $("text").replaceChildren(el("p", "ep", w.episode), el("h1", "", w.heading), ...w.paragraphs.map((p) => el("p", "", p)));
      this.length = CRAWL_FROM + travel() / SPEED;
      this.at(0);
    },
    at(t) {
      $("prelude").style.opacity = String(ramp(t, 0.8, 1.8) * (1 - ramp(t, 5, 6)));
      // the title recedes into the stars, as the crawl begins beneath it
      const k = ramp(t, 5.8, 14);
      $("title").style.opacity = String(ramp(t, 5.8, 6) * (1 - ramp(t, 12, 14)));
      $("title").style.transform = `translate(-50%, -50%) scale(${2.6 * Math.pow(0.02, k)})`;
      $("text").style.transform = `translateY(${-Math.max(0, t - CRAWL_FROM) * SPEED}px)`;
    },
  } : { length: 5, still: true, at() {} };
  window.film.at(0);
</script>
</body>
</html>
