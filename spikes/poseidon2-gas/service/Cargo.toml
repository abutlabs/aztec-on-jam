[package]
name = "poseidon2-gas-service"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["abutlabs <abutlabs@gmx.com>"]
description = "Spike: Poseidon2 hashes and depth-40 tree paths in the PVM; accumulate records each verdict (#41)"

[dependencies]
jam-pvm-common = { path = "../../../../jamswap/tools/jam080/jam-pvm-common", default-features = false, features = ["service"] }
polkavm-derive = "0.36"
p2 = { path = "../p2" }
ark-bn254 = { version = "0.5", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.5", default-features = false }

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1

[workspace]
