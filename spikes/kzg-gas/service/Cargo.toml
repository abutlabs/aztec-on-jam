[package]
name = "kzg-gas-service"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["abutlabs <abutlabs@gmx.com>"]
description = "Spike: EIP-4844's point evaluation (Ethereum's 0x0a precompile) in refine; accumulate records each verdict"

[dependencies]
jam-pvm-common = { path = "../../../../jamswap/tools/jam080/jam-pvm-common", default-features = false, features = ["service"] }
polkavm-derive = "0.36"
kzg-verify = { path = "../../../crates/kzg-verify" }

[profile.release]
# as the services: opt-level 3 + LTO, the cheapest in gas (#13)
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1

[workspace]
