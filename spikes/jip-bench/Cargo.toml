[package]
name = "jip-bench"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Native single-threaded timings of the JIP's host calls (#32), and K: PVM gas per native nanosecond for the same Rust code"

[dependencies]
p2 = { path = "../poseidon2-gas/p2" }
kzg-verify = { path = "../kzg-gas/kzg" }
ecrecover = { path = "../ecdsa-gas/ecrecover" }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
# no-threads: blst's MSM otherwise spreads across cores, and a host call is timed on one thread
blst = { version = "0.3", features = ["no-threads"] }
ark-bls12-381 = { version = "0.5", default-features = false, features = ["curve"] }
# a second BN254 implementation (revm's EIP-196/197 precompiles use it), for #45
substrate-bn = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
