[package]
name = "privacy-service"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["abutlabs <abutlabs@gmx.com>"]
description = "Aztec's privacy runtime as a JAM service: folded Noir kernel proofs verified in refine, roots and nullifiers in accumulate"

[dependencies]
jam-pvm-common = { path = "../../../jamswap/tools/jam080/jam-pvm-common", default-features = false, features = ["service"] }
polkavm-derive = "0.36"
blake2 = { version = "0.10", default-features = false }
service-util = { path = "../../crates/service-util" }
# the curve host calls 101 and 102 where the net has them, field-wise arkworks where not (#58, #55)
curve-hooks = { path = "../../crates/curve-hooks" }
ultrahonk-no-std = { git = "https://github.com/abutlabs/ultrahonk_verifier", rev = "a4b2a4af5d", default-features = false }  # zkVerify PR #9: bb 5.0.x proofs
