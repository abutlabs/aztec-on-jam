[package]
name = "curve-hooks"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "zkVerify's CurveHooks on upstream arkworks, converting points field by field instead of encoding and decoding them (#48): about 14% off an UltraHonk check"

[dependencies]
ark-bn254-ext = { git = "https://github.com/zkVerify/accelerated-bn-cryptography.git", default-features = false, tag = "v0.6.0" }
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
curve-calls = { path = "../curve-calls" }


[dev-dependencies]
ark-std = { version = "0.5", default-features = false, features = ["std"] }
# the two verifier revisions the services pin: bb 6 (aztec-settlement) and bb 5 (privacy)
uh6 = { package = "ultrahonk-no-std", git = "https://github.com/abutlabs/ultrahonk_verifier", rev = "2ae44db", default-features = false }
uh5 = { package = "ultrahonk-no-std", git = "https://github.com/abutlabs/ultrahonk_verifier", rev = "a4b2a4af5d", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("polkavm"))'] }
