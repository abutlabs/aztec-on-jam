[package]
name = "curve-calls"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "The proposed curve host calls 101-104 for JAM services: the PVM imports, each call's first use as its probe, and a native stand-in for tests"

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = "0.36"

[target.'cfg(not(target_env = "polkavm"))'.dependencies]
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("polkavm"))'] }
